    <meta charset="utf-8" />

    <title>FCC Crystallography Explorer</title>
    <style>
      :root {
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
  font-size: 13px;
  color: #2b485d;
  background: #f1f5f6;
  --line: #dce6eb;
  --muted: #7993a2;
  --green: #3e8175;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
summary {
  font: inherit;
}
button,
summary {
  cursor: pointer;
}
button {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: #36596d;
  background: white;
}
button:hover {
  border-color: #9dc3b8;
  background: #edf5f2;
}
button.active {
  color: #2f6c60;
  background: #e5f1eb;
  border-color: #a6cabc;
}
button.primary {
  background: #34786c;
  color: white;
  border-color: #34786c;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 2px solid #67a4b8;
  outline-offset: 2px;
}
input,
select {
  padding: 7px 8px;
  min-width: 0;
  max-width: 100%;
  border: 1px solid #cedde4;
  border-radius: 5px;
  color: #36596d;
  background: white;
}
input[type="checkbox"] {
  width: 15px;
  height: 15px;
  margin: 0;
  accent-color: var(--green);
}
input[type="range"] {
  padding: 0;
  accent-color: var(--green);
  width: 100%;
}
input[type="color"] {
  width: 37px;
  height: 28px;
  padding: 2px;
}
a {
  color: #377f8e;
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
[hidden] {
  display: none !important;
}
header {
  height: 77px;
  padding: 0 23px;
  display: flex;
  gap: 25px;
  align-items: center;
  background: #183647;
  color: #eff7f8;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 270px;
  font-size: 21px;
  letter-spacing: 2px;
}
.brand b {
  font-weight: 400;
}
.brand small {
  display: block;
  font-size: 8px;
  letter-spacing: 1.8px;
  color: #a1bdca;
  margin-top: 5px;
}
.search-wrap {
  position: relative;
  flex: 1;
  max-width: 340px;
}
.search-wrap > input {
  width: 100%;
  background: #254759;
  border-color: #3d5a6c;
  color: white;
  font-size: 12px;
  padding: 10px;
}
.search-wrap input::placeholder {
  color: #a1bdca;
}
#search-results {
  position: absolute;
  top: 42px;
  width: 340px;
  z-index: 50;
  padding: 6px;
  background: white;
  border-radius: 7px;
  box-shadow: 0 8px 24px #173c4d33;
}
#search-results button {
  display: block;
  text-align: left;
  border: 0;
  width: 100%;
  font-size: 12px;
}
.actions {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
}
.actions > button,
#exports > summary {
  color: #d7e6ed;
  background: transparent;
  border: 1px solid #456475;
  font-size: 12px;
  padding: 7px 10px;
  border-radius: 6px;
  white-space: nowrap;
}
.actions > button:first-child {
  border-color: #c9a778;
  color: #efc58b;
}
#exports {
  position: relative;
}
#exports summary {
  list-style: none;
}
#exports > div {
  position: absolute;
  right: 0;
  top: 40px;
  z-index: 40;
  width: 225px;
  background: white;
  padding: 8px;
  border-radius: 7px;
  box-shadow: 0 8px 24px #173c4d33;
}
#exports button {
  display: block;
  width: 100%;
  border: 0;
  text-align: left;
}
#exports small {
  display: block;
  padding: 12px 10px 6px;
  color: var(--muted);
  font-size: 10px;
}
.shell {
  display: grid;
  grid-template-columns: 250px minmax(360px, 1fr) 326px;
  height: calc(100vh - 77px);
  min-height: 650px;
}
.left {
  background: white;
  border-right: 1px solid var(--line);
  overflow: auto;
  display: flex;
  flex-direction: column;
}
.eyebrow {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.7px;
  color: #83a0ae;
}
.nav-title {
  padding: 21px 18px 10px;
}
#topics {
  padding: 0 10px 15px;
  border-bottom: 1px solid var(--line);
}
#topics button {
  display: flex;
  gap: 11px;
  align-items: center;
  width: 100%;
  text-align: left;
  border: 0;
  border-radius: 7px;
  padding: 9px 10px;
  margin: 2px 0;
  background: transparent;
}
#topics button span {
  color: #a1b4bd;
  font-size: 10px;
}
#topics button.active {
  background: #e8f3ee;
  font-weight: 600;
  color: #326d61;
}
#controls {
  padding: 17px;
  flex: 1;
}
.control-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: #7c95a3;
  margin-bottom: 14px;
}
.field {
  display: block;
  margin: 0 0 11px;
}
.field > span {
  font-size: 11px;
  color: #627f91;
  display: flex;
  justify-content: space-between;
  margin-bottom: 5px;
}
.field > input:not([type="color"]),
.field > select {
  width: 100%;
}
.field em {
  font-size: 10px;
  font-style: normal;
  color: #889ca8;
}
.row {
  display: flex;
  gap: 7px;
}
.row > * {
  flex: 1;
  min-width: 0;
}
.check {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  gap: 7px;
  margin: 10px 0;
}
.colors {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  margin: 10px 0;
}
.small-note {
  font-size: 11px;
  color: #8398a4;
  line-height: 1.65;
  margin: 10px 0;
}
.presets {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  margin: 9px 0;
}
.presets button {
  font-size: 11px;
  padding: 6px 3px;
}
.preset-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 14px 0;
}
.preset-list button {
  text-align: left;
  font-size: 12px;
}
.control-detail {
  border-top: 1px solid var(--line);
  margin-top: 16px;
  padding-top: 8px;
}
.control-detail summary {
  font-weight: 600;
  font-size: 12px;
  padding: 6px 0 10px;
}
.offline {
  font-size: 10px;
  letter-spacing: 0.3px;
  color: #78a396;
  border-top: 1px solid var(--line);
  padding: 14px 17px;
}
#lessons:not(:empty) {
  margin: 0 13px 10px;
  padding: 12px;
  border-radius: 8px;
  background: #f8f1e5;
  color: #8f774d;
  font-size: 11px;
}
#lessons strong {
  display: block;
  margin: 5px 0 10px;
}
#lessons button {
  font-size: 10px;
  padding: 6px;
}
progress {
  height: 5px;
  width: 100%;
  accent-color: #c5a26a;
}
main {
  padding: 22px 22px 12px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: auto;
}
.heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 18px;
}
h1 {
  font-size: 23px;
  letter-spacing: -0.5px;
  font-weight: 500;
  line-height: 1.25;
  margin: 7px 0 0;
}
#wide {
  font-size: 25px;
  padding: 4px;
  border: 0;
  background: none;
}
#workspaces {
  display: flex;
  gap: 5px;
  padding-bottom: 11px;
  border-bottom: 1px solid var(--line);
}
#workspaces button {
  border: 0;
  background: none;
  font-size: 12px;
  padding: 6px 10px;
  white-space: nowrap;
}
#workspaces button.active {
  background: white;
  border: 1px solid var(--line);
  box-shadow: 0 1px 4px #1d394810;
}
#workspaces small {
  font-size: 9px;
  color: #8a9fa9;
  margin-left: 5px;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  padding: 10px 0;
}
.toolbar span {
  font-size: 8px;
  letter-spacing: 1px;
  color: #829ba9;
  margin-right: 5px;
}
.toolbar button {
  font-size: 10px;
  padding: 5px 6px;
  background: #f8fbfc;
}
#fit {
  margin-left: auto;
}
.stage {
  position: relative;
  flex: 1;
  min-height: 350px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #eef3f5;
}
#viewer,
#surface {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
#viewer canvas,
#surface svg {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
#surface circle {
  cursor: pointer;
}
#message {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 12px;
  background: #fff9eadf;
  border: 1px solid #e7dbc1;
  color: #977a4f;
  border-radius: 6px;
  padding: 7px 11px;
  font-size: 10px;
  line-height: 1.65;
  pointer-events: none;
}
#legend {
  position: absolute;
  bottom: 36px;
  left: 13px;
  max-width: 240px;
  background: #ffffffdf;
  border-radius: 6px;
  padding: 8px 10px;
  pointer-events: none;
}
#legend:empty {
  display: none;
}
#legend div {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 9px;
  line-height: 1.8;
  color: #628192;
}
.swatch {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: none;
}
#hint {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 9px;
  color: #8299a7;
  pointer-events: none;
}
#view-error {
  position: absolute;
  inset: 20px;
  background: #fff4ef;
  color: #954f39;
  padding: 25px;
  z-index: 10;
  line-height: 1.8;
}
#stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 17px 0 10px;
}
.stat {
  padding: 0 8px;
  border-right: 1px solid var(--line);
}
.stat:first-child {
  padding-left: 0;
}
.stat:last-child {
  border: 0;
}
.stat small {
  display: block;
  font-size: 9px;
  letter-spacing: 0.7px;
  color: #8fa4af;
  text-transform: uppercase;
}
.stat strong {
  display: block;
  font-size: 19px;
  font-weight: 500;
  margin: 5px 0 1px;
}
.stat span {
  font-size: 10px;
  color: #809ba9;
}
/* Panels under the view keep their full height; the 3D stage gives up space instead. */
#stats,
#inspector,
#player,
#sequence {
  flex-shrink: 0;
}
@media (max-height: 820px) {
  .stage {
    min-height: 260px;
  }
}
@media (max-height: 680px) {
  .stage {
    min-height: 220px;
  }
}
#inspector {
  margin-top: 5px;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 10px 12px;
  background: white;
  font-size: 11px;
  color: #7994a3;
  line-height: 1.7;
  max-height: 125px;
  overflow: auto;
}
#inspector strong {
  color: #365b72;
}
#inspector .mini-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2px 8px;
}
#sequence {
  padding: 10px 0;
  display: flex;
  gap: 5px;
  align-items: center;
  flex-wrap: wrap;
}
#sequence small {
  font-size: 9px;
  color: #7f98a6;
  margin-right: 8px;
}
#sequence span {
  border-radius: 4px;
  padding: 5px 8px;
  color: white;
  font-weight: 600;
}
.right {
  background: white;
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
#tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 16px 10px 0;
  border-bottom: 1px solid var(--line);
}
#tabs button {
  background: white;
  border: 0;
  border-radius: 0;
  padding: 12px 3px;
  font-size: 11px;
  color: #8199a7;
}
#tabs button.active {
  border-bottom: 2px solid #548f7e;
  color: #346e60;
  font-weight: 600;
}
#content {
  padding: 22px;
  overflow: auto;
  flex: 1;
}
h2 {
  font-size: 20px;
  font-weight: 500;
  line-height: 1.4;
  letter-spacing: -0.35px;
  margin: 10px 0 15px;
}
h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #5f7d8e;
  margin: 22px 0 9px;
}
.learn p {
  font-size: 12px;
  line-height: 1.8;
  color: #678499;
  margin: 11px 0;
}
.equation {
  background: #f0f6f5;
  border: 1px solid #e0ece8;
  border-radius: 7px;
  color: #3d7267;
  padding: 13px 12px;
  font:
    12px/1.8 ui-monospace,
    Consolas,
    monospace;
  overflow-wrap: anywhere;
  margin: 15px 0;
}
.warning {
  background: #fdf7ed;
  border-left: 2px solid #cfad71;
  border-radius: 0 5px 5px 0;
  padding: 11px 12px;
  margin: 14px 0;
}
.warning strong {
  font-size: 10px;
  letter-spacing: 0.7px;
  color: #a88b56;
}
.warning p {
  font-size: 11px;
  margin: 6px 0;
  line-height: 1.7;
}
.try {
  margin-top: 18px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}
.try strong {
  font-size: 10px;
  letter-spacing: 1px;
  color: #759b8e;
}
.related {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.related button {
  padding: 6px 8px;
  font-size: 10px;
  background: #f7fafb;
}
.reference {
  display: block;
  font-size: 10px;
  line-height: 1.5;
  margin: 8px 0;
}
.calc {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 9px 7px;
  font-size: 11px;
  line-height: 1.5;
}
.calc dt {
  color: #7792a1;
}
.calc dd {
  margin: 0;
  text-align: right;
  color: #385c72;
  font-variant-numeric: tabular-nums;
}
.check-result {
  padding: 10px 0;
  border-bottom: 1px solid #edf2f4;
  font-size: 11px;
  line-height: 1.6;
}
.check-result b {
  color: #408771;
}
.check-result small {
  display: block;
  color: #93a6af;
  font-size: 10px;
  margin-left: 15px;
}
.pass-summary {
  background: #eaf5ef;
  border: 1px solid #d0e7d9;
  color: #4d8065;
  border-radius: 7px;
  padding: 12px;
}
.layer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid #edf2f4;
}
.layer .check {
  flex: 1;
  margin: 0;
  flex-direction: row-reverse;
  justify-content: flex-end;
  font-size: 11px;
}
.layer input[type="color"] {
  width: 26px;
  height: 23px;
}
.layer input[type="range"] {
  width: 55px;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 10px;
  line-height: 1.5;
  margin: 12px 0;
}
th,
td {
  padding: 6px 4px;
  border-bottom: 1px solid var(--line);
  text-align: left;
}
tr[data-slip] {
  cursor: pointer;
}
tr[data-slip]:hover,
tr.current {
  background: #eaf3ee;
}
#toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  background: #285163;
  color: white;
  border-radius: 8px;
  padding: 13px 22px;
  max-width: 85%;
  box-shadow: 0 8px 24px #193c4933;
  font-size: 12px;
}
#toast.error {
  background: #a65341;
}
.wide .shell {
  grid-template-columns: 0 1fr 0;
}
.wide .left,
.wide .right {
  overflow: hidden;
  visibility: hidden;
}
.wide main {
  padding: 20px 35px;
}
@media (min-width: 1600px) {
  .shell {
    grid-template-columns: 270px minmax(400px, 1fr) 365px;
  }
  main {
    padding: 25px 30px;
  }
  h1 {
    font-size: 27px;
  }
  .learn p {
    font-size: 13px;
  }
}
@media (max-width: 1180px) {
  .shell {
    grid-template-columns: 224px minmax(320px, 1fr) 284px;
  }
  header {
    gap: 15px;
    padding: 0 16px;
  }
  .brand {
    min-width: 223px;
    font-size: 17px;
  }
  .brand small {
    font-size: 7px;
  }
  .search-wrap {
    max-width: 220px;
  }
  .actions {
    gap: 4px;
  }
  .actions > button,
  #exports > summary {
    font-size: 10px;
    padding: 7px;
  }
  main {
    padding: 18px 13px;
  }
  h1 {
    font-size: 20px;
  }
  #content {
    padding: 17px;
  }
  #workspaces button {
    font-size: 10px;
    padding: 6px;
  }
  .toolbar button {
    font-size: 9px;
  }
  .stat strong {
    font-size: 17px;
  }
  .stat small {
    font-size: 8px;
  }
  .stat span {
    font-size: 9px;
  }
}
@media (max-width: 1100px) {
  header {
    height: auto;
    min-height: 74px;
    flex-wrap: wrap;
    padding: 12px 15px;
    gap: 10px;
  }
  .brand {
    flex: 1;
  }
  .search-wrap {
    order: 3;
    flex: 1 1 100%;
    max-width: none;
  }
  #search-results {
    width: 100%;
  }
  .shell {
    grid-template-columns: 210px minmax(350px, 1fr);
    height: auto;
  }
  .left {
    max-height: 900px;
  }
  main {
    height: 850px;
  }
  .right {
    grid-column: 1/-1;
    border-top: 1px solid var(--line);
    border-left: 0;
    max-height: 650px;
  }
  #tabs {
    max-width: 500px;
  }
  .learn {
    max-width: 760px;
  }
  .wide .shell {
    grid-template-columns: 1fr;
  }
  .wide .left,
  .wide .right {
    display: none;
  }
}
@media (max-width: 600px) {
  .shell {
    display: flex;
    flex-direction: column;
  }
  .left {
    max-height: none;
  }
  #topics {
    display: flex;
    overflow: auto;
    gap: 4px;
    padding: 0 8px 10px;
  }
  #topics button {
    width: auto;
    white-space: nowrap;
  }
  #topics button span {
    display: none;
  }
  #controls {
    max-height: 340px;
    overflow: auto;
  }
  main {
    height: 820px;
  }
  .offline {
    display: none;
  }
  .actions {
    flex-wrap: wrap;
  }
  #legend {
    max-width: 180px;
  }
  .stat strong {
    font-size: 16px;
  }
}

.surface-stage #legend {
  display: none;
}
/* Keep the 2D net clear of the hint line at the bottom of the stage. */
.surface-stage #surface svg {
  height: calc(100% - 26px);
}

/* Cell ⇄ Net animation player */
#player {
  margin-top: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
}
#player .player-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
#player select {
  width: auto;
}
/* The structure is chosen in Crystal & unit cells; the player only shows it. */
#player .structure-chip {
  padding: 5px 9px;
  border-radius: 6px;
  background: #e5f1eb;
  color: #2f6c60;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
#anim-step {
  flex: 1;
  min-width: 160px;
  font-size: 12px;
  font-weight: 600;
  color: #4b6a7d;
}
#player .speed {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
}
#anim-caption {
  margin: 8px 0 10px;
  min-height: 3.2em;
  font-size: 12.5px;
  line-height: 1.55;
  color: #2f4d60;
}
#anim-scrub {
  flex: 1;
  min-width: 120px;
}
#player button:disabled {
  opacity: 0.45;
  cursor: default;
}
#player button.handoff {
  border-color: #a6cabc;
  color: #2f6c60;
  background: #e5f1eb;
}
.anim-launch {
  display: grid;
  gap: 6px;
  margin-bottom: 6px;
}
.anim-launch button {
  text-align: left;
}
#surface line,
#surface polygon,
#surface text {
  pointer-events: none;
}

 cluster also does not use periodic fractional weights.",try:"Switch on capped boundary spheres, then compare closed, unique and ghost modes.",related:["primitive","coordinates","packing","neighbors"],refs:["miller"],keywords:"counting face centered corners basis pbc periodic supercell"},primitive:{title:"A smaller repeat of the same crystal.",question:"How can the primitive cell be smaller than the cube?",intro:"The conventional cube makes cubic symmetry easy to see. Three shorter face-diagonal translations also tile exactly the same lattice. Their slanted parallelepiped contains one lattice point after sharing.",equation:"p\u2081=(a/2)[011], p\u2082=(a/2)[101], p\u2083=(a/2)[110]",view:"Purple edges show the 3D primitive cell. Its three lengths are a/\u221A2, its angles 60\xB0, and its volume a\xB3/4. The Wigner\u2013Seitz rhombic dodecahedron has the same primitive volume in a different shape.",confusion:"Primitive does not mean cubic. A 3D primitive cell is not a 2D primitive surface cell.",try:"Isolate the primitive cell, increase its tiling, then compare with Wigner\u2013Seitz.",related:["crystal","surface","reciprocal"],refs:["ws","reciprocal"],keywords:"primitive wigner seitz rhombic dodecahedron conventional volume"},coordinates:{title:"A position needs a named coordinate basis.",question:"What does a fractional coordinate mean?",intro:"In conventional cubic coordinates, r=a(X,Y,Z). The same position has supercell fractions (X/Nx,Y/Ny,Z/Nz). Primitive-basis coefficients are another coordinate system.",equation:"r = a(X,Y,Z) = a(Nx f\u2081, Ny f\u2082, Nz f\u2083)",view:"Click a site to compare conventional fractions, Cartesian \xC5, supercell fractions and periodic wrapping. The owner-cell index uses a stated floor-and-clamp convention.",confusion:"Fractional coordinates without a named basis are ambiguous. An outer-boundary sphere can be a periodic image of a site on the opposite boundary.",try:"Use a 2\xD71\xD71 box and click an atom on its right boundary.",related:["crystal","directions","primitive"],refs:["miller"],keywords:"fractional cartesian coordinates position"},directions:{title:"Orientation and vector length are different.",question:"Is a/2[uvw] an FCC lattice translation?",intro:"Integer [u v w] defines an orientation in the cubic basis. An actual vector also needs a scale. a[uvw] is always an FCC lattice translation; a/2[uvw] is one when u+v+w is even.",equation:"r = (a/2)[i j k], with i+j+k even",view:"The arrow label includes its multiplier. A translated arrow has the same direction. A direction family includes all cubic-symmetry-related directed arrows.",confusion:"[111] is valid even though a/2[111] is not an FCC translation. The shortest pure [111] repeat is \u221A3a, not d111.",try:"Compare [110] and [111], then inspect translation parity and the shortest repeat in Calculate.",related:["planes","spacing","slip"],refs:["miller"],keywords:"direction vector uvw family translation"},planes:{title:"Choose the orientation, then the location.",question:"Which exact Miller plane am I seeing?",intro:"The indices supply a cubic normal; hX+kY+lZ=c supplies the position. The canonical c=1 plane has intercepts a/h, a/k and a/l, with infinity for zero indices.",equation:"hX + kY + lZ = c, where X=x/a",view:"Centered and translated planes retain their orientation. Highlighted atoms are exact plane members. Negative-index canonical planes may be outside the positive-coordinate box; the app explains this instead of silently moving them.",confusion:"A symmetry family {hkl}, a set of parallel planes, an actual atomic layer and a slab are different objects. (100) and (200) have the same orientation but different d.",try:"Try (1 \u22121 0), compare canonical/centered locations, and enable a second plane or direction in the comparison controls.",related:["directions","spacing","surface","reciprocal"],refs:["miller"],keywords:"miller plane hkl family intercept angle zone law normal"},spacing:{title:"Three distances with different meanings.",question:"Why is the [111] repeat three times d111?",intro:"Geometric d_hkl measures a unit change of c. Occupied atomic layers only occur at allowed c levels. A pure normal translation must return to an equivalent lattice site without a lateral shift.",equation:"d=a/|hkl|; \u0394layer=ag/(2|hkl|); g=gcd(k+l,h+l,h+k)",view:"For (111), layers are a/\u221A3 apart and cycle A\u2192B\u2192C. A repeats after three gaps: \u221A3a. For (001), neighboring atomic layers are a/2 apart, whereas geometric d001=a.",confusion:"A forbidden FCC(100) reflection does not imply that an FCC(100) surface cannot exist.",try:"Compare (001), (002), (110) and (111) in Calculate. Rescaling indices must not change the true atomic-layer spacing.",related:["planes","stacking","reciprocal"],refs:["miller","reciprocal"],keywords:"spacing d111 d001 interplanar layer repeat period"},surface:{title:"A 2D lattice inside a 3D crystal.",question:"Why is FCC(111) a triangular surface net?",intro:"Translations within one atomic layer form a two-dimensional lattice. We construct an exact integer kernel in the FCC primitive basis, then reduce its two vectors without changing the lattice.",equation:"(k+l)m\u2081 + (h+l)m\u2082 + (h+k)m\u2083 = 0",view:"The purple surface cell has one lattice point after sharing. Area times adjacent-layer spacing equals a\xB3/4, certifying a primitive cell. The 2D viewer analytically projects just this layer onto orthogonal in-plane axes.",confusion:"Projecting all atoms through a thick slab gives a different picture. The dashed integer cubic-translation mesh is not necessarily the primitive surface cell, nor a unique conventional choice.",try:"Compare (001), (110), (111) and (210). Calculate shows the actual integer basis; Verify checks primitivity.",related:["planes","primitive","packing","stacking"],refs:["miller"],keywords:"surface 2d net planar density primitive square rectangle triangle rhombus (001) (110) (111)"},packing:{title:"Touching along a face diagonal.",question:"Where does a/\u221A2 come from?",intro:"The face diagonal connects a corner, a face centre and the opposite corner. Its length a\u221A2 contains two nearest-neighbor distances, or four radii for touching equal spheres.",equation:"4R=a\u221A2; dNN=a/\u221A2; APF=\u03C0/(3\u221A2)",view:"FCC {111} layers are close packed. Each atom has six neighbors in its layer and three in each neighboring layer. The close-packed in-plane directions belong to <110>.",confusion:"The hard-sphere radius is geometric, not a measured radius of the chosen element. Small display spheres do not change the lattice calculations.",try:"Choose hard-sphere mode, open the (111) surface net and inspect the six contacts.",related:["surface","stacking","neighbors","slip"],refs:["faults"],keywords:"packing APF hard sphere close packed radius"},stacking:{title:"Same triangular layers, different registries.",question:"What changes between ABCABC and ABAB?",intro:"A, B and C tell you how a triangular layer is shifted sideways. Reusing A on the third layer gives HCP-type ABAB. Using the third registry gives FCC ABCABC.",equation:"FCC: ABCABC\u2026     HCP: ABAB\u2026",view:"This comparison uses x parallel to cubic [1 \u22121 0], y parallel to [1 1 \u22122] and z parallel to [111]. The FCC stack maps back exactly to that cubic lattice. Layer addition, filters and side/normal cameras expose each registry.",confusion:"The letters are not chemical species. AAA is non-close-packed and uses a/\u221A2 height to avoid overlap. Display separation is an explicit visual exaggeration.",try:"Look normal, hide C, then look from the side. Fault and twin presets show stated geometric sequence constructions, not relaxed defect simulations.",related:["spacing","surface","packing","partials"],refs:["faults"],keywords:"stacking ABC ABAB AAA hcp intrinsic extrinsic fault twin"},neighbors:{title:"Twelve neighbors, including those beyond the box.",question:"Where are all twelve nearest neighbors?",intro:"A finite drawing does not truncate an infinite crystal. Bulk neighbors come from FCC lattice translations around the chosen host, including periodic images outside the box.",equation:"Shells: 12 at a/\u221A2; 6 at a; 24 at a\u221A(3/2)",view:"The selected center remains highlighted. Gold spheres and bonds show the included shells. The first-shell coordination hull is a cuboctahedron. A cutoff can remove part of a shell; it does not redefine ideal bulk FCC coordination.",confusion:"Bulk coordination differs from coordination within a single surface layer or at a terminated, relaxed surface.",try:"Select a corner, show the first shell, and count the neighbors outside the cube.",related:["interstitials","packing","surface"],refs:["ws"],keywords:"neighbors coordination shells nearest cutoff cuboctahedron"},interstitials:{title:"Empty sites between host atoms.",question:"How do octahedral and tetrahedral holes differ?",intro:"Interstitial markers show potential positions between host atoms; they are empty in the ideal monatomic crystal. Octahedral sites have six nearest hosts, tetrahedral sites four.",equation:"Octa: 4/cell, r/R=\u221A2\u22121; Tetra: 8/cell, r/R=\u221A(3/2)\u22121",view:"Pink markers identify octahedral holes and yellow markers tetrahedral holes. Click a marker to connect its hosts. Low host opacity helps pick a hole through the drawing.",confusion:"The FCC body centre is a hole, not a host atom. Radius ratios assume equal touching, undistorted hard spheres.",try:"Click the body-center octahedral marker, then compare a tetrahedral marker at a quarter coordinate.",related:["neighbors","packing","crystal"],refs:["miller"],keywords:"interstitial octahedral tetrahedral void hole radius"},slip:{title:"A plane plus an in-plane direction.",question:"Why are there twelve FCC slip systems?",intro:"Four unoriented {111} planes each contain three unoriented <110> directions. Their twelve plane/direction pairs are the usual FCC slip systems.",equation:"{111}<110>; b=(a/2)<110>; m=|l\u0302\xB7n\u0302| |l\u0302\xB7b\u0302|",view:"The sheet shows a slip plane translated through the box center. The arrow shows its Burgers vector. Calculate lists Schmid factors for all twelve systems; clicking a row selects that system.",confusion:"Schmid factor is geometric, not yield stress. Opposite Burgers signs count as one system. Directions shared by different planes can overlap in an all-system view.",try:"Compare [001], [111] and [123] loading directions. All factors must be at most 0.5.",related:["directions","planes","packing","partials"],refs:["burgers"],keywords:"slip system schmid load deformation burgers"},partials:{title:"Two partial vectors sum to one perfect vector.",question:"How do Shockley partials add up?",intro:"A perfect FCC lattice translation can split geometrically into two a/6<112> vectors on a {111} plane. Each partial is not itself an FCC lattice translation.",equation:"a/2[1 \u22121 0] = a/6[2 \u22121 \u22121] + a/6[1 \u22122 1]",view:"The two partial arrows are placed head to tail; the third arrow is their sum. Dotting each with [111] gives zero. The perfect magnitude is a/\u221A2, and each partial magnitude a/\u221A6.",confusion:"This is a Burgers-vector construction. It does not simulate a dislocation line, core, elastic displacement, partial separation or stacking-fault energy.",try:"Look along [111] and verify the vector sum, then inspect an intrinsic-fault stacking sequence.",related:["slip","stacking","directions"],refs:["faults","burgers"],keywords:"shockley partial dislocation dissociation burgers fault"},reciprocal:{title:"Periodicity expressed as wavevectors.",question:"Why are some FCC reflections absent?",intro:"Equal scatterers at the four conventional FCC positions contribute different phases. Mixed odd/even indices cancel. All-even or all-odd indices add constructively.",equation:"F/f=1+(\u22121)^(k+l)+(\u22121)^(h+l)+(\u22121)^(h+k)",view:"Purple nodes form the reciprocal BCC lattice, with conventional edge 4\u03C0/a. Grid units are 2\u03C0/a \xC5\u207B\xB9. Faint forbidden positions are comparison markers, not reciprocal-lattice nodes; (000) is the forward-scattering origin.",confusion:"A forbidden reflection does not forbid a real-space surface. The Bragg calculator supplies positions, not realistic intensity, broadening, texture or multiple scattering.",try:"Compare (111), (200), (220) with (100), (110), then change wavelength and check \u03BB\u22642d.",related:["planes","spacing","primitive"],refs:["reciprocal","diffraction"],keywords:"reciprocal diffraction xrd bcc bragg selection forbidden allowed structure factor"},cellnet:{title:"One crystal, two pictures.",question:"How do 3D cells and 2D nets fit together?",intro:"Every Miller-plane family slices a crystal into identical atomic layers. Pick simple cubic, BCC, FCC or HCP and follow one conventional cell as it is cut into layers, flattened into a 2D net and rebuilt by stacking; or walk from the primitive cell to the conventional cell, the 3D array and one 2D layer, and back again.",equation:"s = hX + kY + lZ;  d = \u0394s\xB7a/|hkl|;  area \xD7 d = V_primitive (a\xB3, a\xB3/2, a\xB3/4)",view:"The player under the view chooses the structure and one of five animations, for the plane and occupied layer of the surface panel. HCP planes use hexagonal axes: (h k l) is written (h k i l) with i = \u2212(h + k). Captions use the current numbers. Back/Next or \u2190/\u2192 move one step; the scrubber moves continuously.",confusion:"A shape cut out by the cell walls is not automatically a cell: the (111) triangle cannot tile the plane by translation. Stacked layers repeat only after N layers, where N\xB7d is the shortest lattice vector along the normal. In HCP the B atoms can form layers of their own between the A layers, so the spacings may alternate, as on the (10\u221210) prism planes.",try:"Run 3D cell \u2192 2D net for FCC (111), then BCC (110) and HCP (0001). Run Primitive \u2192 3D \u2192 2D for each structure and compare the atoms per cell: 1, 2, 4 and 6.",related:["surface","stacking","primitive","spacing"],refs:["miller"],keywords:"animation layers slice stack net 3d 2d deconstruct build primitive conventional array period shift cell sc bcc hcp simple cubic body centered hexagonal close packed"}},uh="Translations within one atomic layer form a two-dimensional lattice. We construct an exact integer kernel in the primitive basis of the structure, then reduce its two vectors without changing the lattice.",Tm={sc:{crystal:{title:"One cell. One atom. Eight visible sites.",question:"Why does simple cubic have one atom per cell?",intro:"Extend the cube in all three directions. Each corner is shared by eight cubes, so the eight corner spheres add up to one atom. Full spheres show where the lattice sites are; fractions tell you how much belongs to one cell.",equation:"8 \xD7 \u215B = 1",view:"The default drawing includes all eight corners. Unique mode keeps one corner per cell (a half-open computational box). Ghost mode completes the visible boundaries with distinguished periodic images.",confusion:"One atom per cell does not mean a cell drawing should show one sphere. Simple cubic is rare among metals (polonium); it is the easiest lattice for counting.",try:"Switch on capped boundary spheres: eight \u215B pieces make one atom."},primitive:{title:"Here the cube is already primitive.",question:"Is the simple cubic cell primitive?",intro:"The three cube edges are the shortest lattice translations, and the cube holds one lattice point after sharing, so it is already the primitive cell. The Wigner\u2013Seitz cell is a cube of the same volume centered on an atom.",equation:"p\u2081=a[100], p\u2082=a[010], p\u2083=a[001]; V=a\xB3",view:"Purple edges show the primitive cell; for simple cubic they coincide with the conventional cube. The Wigner\u2013Seitz cell is the same cube, shifted to surround one atom.",confusion:"Conventional and primitive cells are different choices in general, but for simple cubic they are the same cube.",try:"Compare the primitive volumes of SC (a\xB3), BCC (a\xB3/2) and FCC (a\xB3/4) with the structure selector."},directions:{question:"Which vectors along [uvw] are simple cubic translations?",intro:"Integer [u v w] defines an orientation in the cubic basis. An actual vector also needs a scale. In simple cubic, a[uvw] is a lattice translation and no shorter fraction of a reduced [uvw] is.",equation:"r = a[u v w], with u, v, w integers",confusion:"The shortest pure [111] repeat is \u221A3a, which is three times d\u2081\u2081\u2081 = a/\u221A3, not d\u2081\u2081\u2081 itself."},spacing:{question:"Why does d equal the layer spacing in simple cubic?",intro:"Geometric d_hkl measures a unit change of c. In simple cubic every integer level c of reduced (hkl) holds atoms, so the layer spacing equals d_hkl; the pure normal repeat can still span several layers.",equation:"d = a/|hkl|; layers at every integer c",view:"For (111), layers are a/\u221A3 apart and cycle A\u2192B\u2192C; the pure repeat along [111] is \u221A3a. For (001), layers are a apart and stack straight on top of each other.",confusion:"Rescaling (111) to (222) halves d_hkl but does not move a single atom: the real layer spacing stays a/\u221A3."},surface:{intro:uh,equation:"h\xB7m\u2081 + k\xB7m\u2082 + l\xB7m\u2083 = 0 (primitive basis = cube edges)",view:"The purple surface cell has one lattice point after sharing. Area times the layer step equals the primitive volume a\xB3, certifying a primitive cell. The 2D viewer analytically projects just this layer onto orthogonal in-plane axes.",try:"Compare (001), (110) and (111). Calculate shows the actual integer basis; Verify checks primitivity."},packing:{title:"Touching along a cube edge.",question:"Where does R = a/2 come from?",intro:"In simple cubic the nearest neighbors sit along the cube edges, a apart, so touching spheres have 2R = a. They fill only about 52% of space.",equation:"2R=a; dNN=a; APF=\u03C0/6",view:"Simple cubic {100} layers are square nets: each atom has four neighbors in its layer and one directly above and below.",try:"Choose hard-sphere mode, open the (001) surface net and count the four contacts."},stacking:{confusion:"The letters are not chemical species. This workspace compares close-packed layers (FCC ABC, HCP ABAB), which simple cubic does not have; the layer stacking of any simple cubic plane is in Cell \u21C4 Net."},neighbors:{title:"Six neighbors, including those beyond the box.",question:"Where are the six nearest neighbors in simple cubic?",intro:"A finite drawing does not truncate an infinite crystal. Bulk neighbors come from lattice translations around the chosen host, including periodic images outside the box.",equation:"Shells: 6 at a; 12 at a\u221A2; 8 at a\u221A3",view:"The selected center remains highlighted. Gold spheres and bonds show the included shells. The first-shell coordination hull is an octahedron. A cutoff can remove part of a shell; it does not redefine ideal bulk coordination.",try:"Select a corner, show the first shell, and count the neighbors outside the cube."},interstitials:{title:"One large hole in the middle.",question:"Where is the simple cubic hole?",intro:"Interstitial markers show potential positions between host atoms; they are empty in the ideal monatomic crystal. In simple cubic the large hole is the cube center, with eight hosts at a\u221A3/2.",equation:"Cubic: 1/cell, 8 hosts, r/R=\u221A3\u22121",view:"Blue markers identify the cubic holes. Click a marker to connect its hosts. Low host opacity helps pick a hole through the drawing.",confusion:"BCC puts an atom exactly at this position; simple cubic leaves it empty. Radius ratios assume equal touching, undistorted hard spheres.",try:"Click the body-center marker and show its eight hosts."},slip:{question:"Why are there six simple cubic slip systems?",intro:"Simple cubic slips on {100} planes along \u27E8100\u27E9, its shortest translation: three planes, each containing two in-plane directions.",equation:"{100}\u27E8010\u27E9; b=a\u27E8100\u27E9; m=|l\u0302\xB7n\u0302| |l\u0302\xB7b\u0302|",view:"The sheet shows a slip plane translated through the box center. The arrow shows its Burgers vector. Calculate lists Schmid factors for all six systems; clicking a row selects that system."},partials:{title:"No simple partials here.",question:"Do simple cubic crystals have Shockley partials?",intro:"Shockley partials split a perfect vector on a close-packed plane and leave a stacking fault between them. Simple cubic has no close-packed plane, so this construction is shown for FCC and HCP.",equation:"FCC: a/2\u27E8110\u27E9 = a/6\u27E8211\u27E9 + a/6\u27E8121\u27E9; HCP: a/3\u27E811\u221220\u27E9 = a/3\u27E810\u221210\u27E9 + a/3\u27E801\u221210\u27E9",view:"Choose FCC or HCP in Crystal & unit cells to see the partial-vector triangle.",try:"Switch to FCC and look along [111] to see the Shockley partials."},reciprocal:{question:"Why are all simple cubic reflections allowed?",intro:"With one atom per cube, every (hkl) scatters in phase: the reciprocal lattice is simple cubic with edge 2\u03C0/a, and no reflection is absent.",equation:"F/f = 1",view:"Purple nodes form the reciprocal simple cubic lattice. Grid units are 2\u03C0/a \xC5\u207B\xB9; (000) is the forward-scattering origin.",try:"Compare (100), (110) and (111), then change the wavelength and check \u03BB\u22642d."}},bcc:{crystal:{title:"One cell. Two atoms. Nine visible sites.",question:"Why does BCC have two atoms per cell?",intro:"Extend the cube in all three directions. Each corner is shared by eight cubes; the body center belongs to this cube alone. Full spheres show where the lattice sites are; fractions tell you how much belongs to one cell.",equation:"8 \xD7 \u215B + 1 = 2",view:"The default drawing includes all eight corners and the body center. Unique mode deliberately uses a half-open computational box. Ghost mode completes the visible boundaries with distinguished periodic images.",confusion:"The body center is not a different kind of site: it is a corner of the neighboring cubes shifted by a/2[111]. Every BCC atom has the same surroundings.",try:"Switch on capped boundary spheres, then compare closed, unique and ghost modes."},primitive:{question:"How can the BCC primitive cell be half the cube?",intro:"The conventional cube shows the cubic symmetry. Three translations from a corner to the body centers of neighboring cubes tile exactly the same lattice. Their rhombohedron contains one lattice point after sharing.",equation:"p\u2081=(a/2)[\u2212111], p\u2082=(a/2)[1\u221211], p\u2083=(a/2)[11\u22121]",view:"Purple edges show the 3D primitive cell. Its three lengths are a\u221A3/2, its angles 109.47\xB0, and its volume a\xB3/2. The Wigner\u2013Seitz cell, a truncated octahedron, has the same volume.",confusion:"Primitive does not mean cubic, and part of the primitive cell lies outside the cube. A 3D primitive cell is not a 2D primitive surface cell."},directions:{question:"Is a/2[uvw] a BCC lattice translation?",intro:"Integer [u v w] defines an orientation in the cubic basis. An actual vector also needs a scale. a[uvw] is always a BCC translation; a/2[uvw] is one when u, v and w are all odd, such as a/2[111] to the body center.",equation:"r = (a/2)[i j k], with i, j, k all even or all odd",confusion:"[110] is a valid direction, but a/2[110] is not a BCC translation: the shortest repeat along [110] is a\u221A2. Along [111] it is a\u221A3/2, the nearest-neighbor distance.",try:"Compare [100], [110] and [111], then inspect the shortest repeats in Calculate."},spacing:{question:"Why is d\u2081\u2080\u2080 not the BCC layer spacing?",intro:"Geometric d_hkl measures a unit change of c. Atoms occupy c levels from the corners and from the body centers: when h + k + l is odd, the body centers add a layer halfway between.",equation:"d=a/|hkl|; layers every \u0394c = \xBD (h+k+l odd) or 1 (even)",view:"For (001), corner and body-center layers alternate a/2 apart, half of d\u2080\u2080\u2081 = a. For (110), the densest plane, layers are a/\u221A2 apart and stack ABAB. For (111) they cycle ABC, a/(2\u221A3) apart.",confusion:"The forbidden BCC (100) reflection goes with those extra body-center layers halfway between the (100) planes; it does not mean a BCC (100) surface cannot exist."},surface:{intro:uh,equation:"(\u2212h+k+l)m\u2081 + (h\u2212k+l)m\u2082 + (h+k\u2212l)m\u2083 = 0",view:"The purple surface cell has one lattice point after sharing. Area times the layer step equals the primitive volume a\xB3/2, certifying a primitive cell. The 2D viewer analytically projects just this layer onto orthogonal in-plane axes.",try:"Compare (001), (110) and (111). (110) is the densest BCC plane: a centered-rectangular net."},packing:{title:"Touching along a body diagonal.",question:"Where does R = a\u221A3/4 come from?",intro:"The body diagonal connects a corner, the body center and the opposite corner. Its length a\u221A3 holds two nearest-neighbor distances, or four radii for touching equal spheres.",equation:"4R=a\u221A3; dNN=a\u221A3/2; APF=\u03C0\u221A3/8",view:"BCC {110} planes are the densest: a centered-rectangular net in which each atom has four in-layer neighbors. The close-packed directions belong to \u27E8111\u27E9.",try:"Choose hard-sphere mode, open the (110) surface net and inspect the contacts."},stacking:{confusion:"The letters are not chemical species. This workspace compares close-packed layers (FCC ABC, HCP ABAB), which BCC does not have; the layer stacking of any BCC plane, such as (110) ABAB, is in Cell \u21C4 Net."},neighbors:{title:"Eight neighbors, and six more close behind.",question:"Where are the eight nearest neighbors in BCC?",intro:"A finite drawing does not truncate an infinite crystal. Bulk neighbors come from lattice translations around the chosen host, including periodic images outside the box.",equation:"Shells: 8 at a\u221A3/2; 6 at a; 12 at a\u221A2",view:"The selected center remains highlighted. Gold spheres and bonds show the included shells. The first-shell coordination hull is a cube. A cutoff can remove part of a shell; it does not redefine ideal bulk coordination.",confusion:"The six second neighbors are only 15% farther than the first eight, so BCC is often described as 8 + 6 coordinated. Bulk coordination differs from coordination within a single surface layer.",try:"Select the body center, show two shells, and compare the distances in Calculate."},interstitials:{question:"Why are BCC holes smaller than FCC holes?",intro:"Interstitial markers show potential positions between host atoms; they are empty in the ideal monatomic crystal. BCC octahedral holes sit at face centers and edge midpoints (6 per cell) and are distorted: two hosts at a/2, four at a/\u221A2. Tetrahedral holes, such as (\xBD, \xBC, 0), number 12 per cell.",equation:"Octa: 6/cell, r/R=2/\u221A3\u22121; Tetra: 12/cell, r/R=\u221A(5/3)\u22121",confusion:"In BCC the tetrahedral holes are larger than the octahedral ones, the reverse of FCC. Carbon in \u03B1-iron still prefers the octahedral sites, because it only has to push the two near hosts apart.",try:"Click a face-center octahedral marker, then a tetrahedral marker on a face."},slip:{question:"Why are there twelve BCC {110} slip systems?",intro:"BCC has no close-packed plane. It slips along the close-packed \u27E8111\u27E9 directions, most often on the six {110} planes, each containing two \u27E8111\u27E9: twelve systems. {112} and {123} planes can also act.",equation:"{110}\u27E8111\u27E9; b=(a/2)\u27E8111\u27E9; m=|l\u0302\xB7n\u0302| |l\u0302\xB7b\u0302|"},partials:{title:"No simple partials here.",question:"Do BCC crystals have Shockley partials?",intro:"Shockley partials split a perfect vector on a close-packed plane and leave a stacking fault between them. BCC has no close-packed plane, so this construction is shown for FCC and HCP.",equation:"FCC: a/2\u27E8110\u27E9 = a/6\u27E8211\u27E9 + a/6\u27E8121\u27E9; HCP: a/3\u27E811\u221220\u27E9 = a/3\u27E810\u221210\u27E9 + a/3\u27E801\u221210\u27E9",view:"Choose FCC or HCP in Crystal & unit cells to see the partial-vector triangle.",try:"Switch to FCC and look along [111] to see the Shockley partials."},reciprocal:{question:"Why are some BCC reflections absent?",intro:"Equal scatterers at the corner and the body center contribute phases that cancel when h + k + l is odd and add when it is even. The allowed nodes form a reciprocal FCC lattice.",equation:"F/f = 1 + (\u22121)^(h+k+l)",view:"Purple nodes form the reciprocal FCC lattice, with conventional edge 4\u03C0/a. Grid units are 2\u03C0/a \xC5\u207B\xB9. Faint forbidden positions are comparison markers, not reciprocal-lattice nodes; (000) is the forward-scattering origin.",try:"Compare (110), (200), (211) with (100), (111), then change wavelength and check \u03BB\u22642d."}},hcp:{crystal:{title:"A hexagonal prism of three unit cells.",question:"Why does the HCP prism hold six atoms?",intro:"HCP repeats a hexagonal unit cell a\u2081, a\u2082, c (a 120\xB0 rhombic prism) with two atoms: A at the corners, B inside. Three unit cells make the familiar hexagonal prism: 12 corners shared by six prisms, 2 face centers shared by two, and 3 atoms inside.",equation:"12 \xD7 \u2159 + 2 \xD7 \xBD + 3 = 6; unit cell: 8 \xD7 \u215B + 1 = 2",view:"The prism drawing shows every corner and face center. Turn the prism off to see the unit-cell supercell, where unique and ghost modes and capped spheres follow the slanted cell faces. The ideal axial ratio c/a = \u221A(8/3) \u2248 1.633.",confusion:"HCP is not a Bravais lattice: A and B atoms have mirrored surroundings, so the 2-atom basis is part of the structure. The prism is three unit cells, not the primitive cell.",try:"Switch on capped boundary spheres and count \u2159 corners, \xBD face centers and whole inside atoms."},primitive:{title:"The unit cell is already primitive.",question:"What is the HCP primitive cell?",intro:"The hexagonal lattice of HCP is spanned by a\u2081, a\u2082 (equal, 120\xB0 apart) and c. That rhombic prism is primitive for the lattice, but it carries two atoms, A and B: the basis.",equation:"a\u2081 = a[100], a\u2082 = a[\u2212\xBD \u221A3/2 0], c = a\u221A(8/3)[001]; V = (\u221A3/2)a\xB2c",view:"Purple edges show the primitive cell, the same as the hexagonal unit cell. The Wigner\u2013Seitz cell of the hexagonal lattice is a hexagonal prism of the same volume.",confusion:"Two atoms per primitive cell does not make the cell non-primitive: the B atom is not a lattice translation of A.",try:"Isolate the primitive tiling and find the B atom inside each cell."},coordinates:{intro:"In HCP the unit-cell axes a\u2081, a\u2082 and c are not orthogonal, so fractional coordinates (f\u2081, f\u2082, f\u2083) and Cartesian r are related by r = f\u2081a\u2081 + f\u2082a\u2082 + f\u2083c. The B atom sits at (\u2153, \u2154, \xBD).",equation:"r = f\u2081a\u2081 + f\u2082a\u2082 + f\u2083c",view:"Click a site to compare unit-cell fractions, Cartesian \xC5, supercell fractions and periodic wrapping. Turn the prism off to see the unit-cell supercell.",try:"Click a B atom and compare its fractions with its Cartesian coordinates."},directions:{question:"How do HCP directions [u v t w] work?",intro:"HCP directions use the axes a\u2081, a\u2082 (120\xB0 apart) and c. The three-index [u v w] means u a\u2081 + v a\u2082 + w c; the four-index [u v t w] form adds t = \u2212(u + v), so symmetry-equivalent directions look alike: [2\u22121\u221210], [\u221212\u221210] and [\u22121\u2212120] are a\u2081, a\u2082 and a\u2083.",equation:"[U V W] \u2192 [u v t w] = [(2U\u2212V)/3, (2V\u2212U)/3, \u2212(U+V)/3, W]",view:"Arrow labels use the four-index form. Type three or four indices; a four-index direction must have t = \u2212(u + v).",confusion:"[1 0 0] in three indices is a\u2081, written [2 \u22121 \u22121 0] in four. The shortest translations are a along \u27E811\u221220\u27E9 and c along [0001].",try:"Compare [2\u22121\u221210], [10\u221210] and [0001] and their shortest repeats in Calculate."},planes:{question:"How do I read an HCP plane (h k i l)?",intro:"HCP planes use the axes a\u2081, a\u2082 and c. The Miller\u2013Bravais form (h k i l) adds i = \u2212(h + k), so equivalent planes look alike: the six prism planes are (10\u221210), (01\u221210), (\u22121100) and their opposites. The plane h\xB7f\u2081 + k\xB7f\u2082 + l\xB7f\u2083 = c is located like a cubic one, in fractional coordinates.",equation:"h f\u2081 + k f\u2082 + l f\u2083 = c; i = \u2212(h + k)",view:"Planes are clipped to the hexagonal prism, or to the unit-cell supercell. Highlighted atoms lie exactly on the plane.",confusion:"In HCP, (h k l) and [h k l] are not perpendicular in general; the plane normal is G = h b\u2081 + k b\u2082 + l b\u2083.",try:"Compare (0001), (10\u221210) and (11\u221220), then the hexagonal symmetry family of (10\u221211)."},spacing:{title:"Spacings that alternate.",question:"Why do HCP layer spacings alternate?",intro:"HCP has two atoms per lattice point. On (0001) the B atoms add a layer halfway, so layers are c/2 apart (ABAB). On prism planes such as (10\u221210) the B layers sit off-center, so the spacings alternate between a\u221A3/6 and a\u221A3/3.",equation:"d = 1/|G|, G = h b\u2081 + k b\u2082 + l b\u2083",view:"Calculate lists every layer level and spacing. The pure normal repeat is the shortest lattice vector along G.",confusion:"The layer spacing of a structure with a basis can be unequal; d_hkl alone does not tell you where the atoms are.",try:"Compare (0001), (10\u221210) and (11\u221220) in Calculate."},surface:{intro:uh,equation:"h\xB7m\u2081 + k\xB7m\u2082 + l\xB7m\u2083 = 0 on a\u2081, a\u2082, c",view:"The purple surface cell has one or two atoms: (0001) and (10\u221210) layers hold one, (11\u221220) layers both basis atoms. Area times the lattice-layer step equals the primitive volume (\u221A3/2)a\xB2c.",confusion:"Projecting all atoms through a thick slab gives a different picture. The dashed integer a\u2081, a\u2082, c translation mesh is not necessarily the primitive surface cell.",try:"Compare (0001), (10\u221210) and (11\u221220). Calculate shows the actual integer basis."},packing:{title:"Touching in the basal plane.",question:"How does HCP reach 74% packing?",intro:"In each (0001) layer the spheres touch along a\u2081, so 2R = a. B atoms sit over half of the hollows, touching three A atoms below and three above; the ideal c/a = \u221A(8/3) makes all twelve contacts equal.",equation:"2R=a; dNN=a; c/a=\u221A(8/3); APF=\u03C0/(3\u221A2)",view:"HCP (0001) layers are close packed like FCC {111}; they stack ABAB instead of ABCABC.",try:"Choose hard-sphere mode, open the (0001) surface net and inspect the six contacts."},stacking:{question:"How does HCP stack its close-packed layers?",intro:"A, B and C tell you how a triangular layer is shifted sideways. HCP reuses A on every second layer (ABAB); FCC uses all three registries (ABCABC).",try:"Choose Ideal HCP \xB7 ABAB, look normal, then from the side; compare with FCC \xB7 ABCABC."},neighbors:{equation:"Shells: 12 at a; 6 at a\u221A2; 2 at c = a\u221A(8/3)",view:"The selected center remains highlighted. Gold spheres and bonds show the included shells. The first-shell coordination hull is an anticuboctahedron. A cutoff can remove part of a shell; it does not redefine ideal bulk coordination.",confusion:"The twelve HCP neighbors look like FCC's, but the triangles above and below are not rotated: an anticuboctahedron, not a cuboctahedron.",try:"Select an atom, show the first shell, and compare it with FCC's."},interstitials:{question:"Where are the holes in HCP?",intro:"Interstitial markers show potential positions between host atoms; they are empty in the ideal monatomic crystal. As in FCC, each pair of close-packed layers makes octahedral and tetrahedral holes: 2 octahedral and 4 tetrahedral per unit cell.",equation:"Octa: 2/cell, r/R=\u221A2\u22121; Tetra: 4/cell, r/R=\u221A(3/2)\u22121",confusion:"The hole sizes match FCC because both are close packed; only the stacking of the layers that form them differs.",try:"Click an octahedral marker between an A and a B layer."},slip:{question:"Which HCP slip systems share the \u27E8a\u27E9 vector?",intro:"HCP slips along \u27E811\u221220\u27E9 with |b| = a. The basal plane (0001) has 3 systems, the prism planes {10\u221210} 3 and the first-order pyramidal planes {10\u221211} 6: twelve \u27E8a\u27E9 systems. None of them can stretch the crystal along c; that needs \u27E8c+a\u27E9 slip or twinning.",equation:"b=(a/3)\u27E811\u221220\u27E9; basal 3 + prismatic 3 + pyramidal 6",view:"The sheet shows a slip plane translated through the region center. The arrow shows its Burgers vector. Calculate lists Schmid factors for all twelve systems; clicking a row selects that system.",try:"Compare loading along [0001] (all \u27E8a\u27E9 factors are 0) with [2\u22121\u221210]."},partials:{title:"Two basal partials sum to one \u27E8a\u27E9 vector.",question:"How do HCP basal partials add up?",intro:"On the basal plane a perfect a/3[11\u221220] vector can split geometrically into two Shockley partials a/3[10\u221210] and a/3[01\u221210], each of length a/\u221A3.",equation:"a/3[11\u221220] = a/3[10\u221210] + a/3[01\u221210]",view:"The two partial arrows are placed head to tail; the third arrow is their sum. All three lie in (0001). The perfect magnitude is a, and each partial magnitude a/\u221A3.",try:"Look along [0001] and verify the vector sum."},reciprocal:{question:"Why are some HCP reflections absent?",intro:"The A and B atoms at (0,0,0) and (\u2153,\u2154,\xBD) scatter with phase 2\u03C0(h/3 + 2k/3 + l/2). When h + 2k is a multiple of 3 and l is odd they cancel, so (0001) is absent but (0002) is allowed.",equation:"|F/f| = |1 + e^(2\u03C0i(h/3 + 2k/3 + l/2))|",view:"Purple nodes form the hexagonal reciprocal lattice. Grid units are 2\u03C0/a \xC5\u207B\xB9; faint markers are forbidden positions, not reciprocal-lattice nodes.",try:"Compare (0001), (0002) and (10\u221211), then change the wavelength and check \u03BB\u22642d."}}},Ro=(n,e="fcc")=>({...fa[n],...Tm[e]?.[n]??{}}),Ri=[["crystal","Conventional FCC cell","basic"],["crystal","Counting shared atoms","counting"],["primitive","3D primitive cell","primitive"],["directions","Directions & translations","directions"],["planes","Miller planes","planes"],["surface","Low-index surfaces","surface001"],["surface","2D primitive cells","surface111"],["cellnet","3D cell \u2192 2D net","animDeconstruct"],["cellnet","2D net \u2192 3D cell","animBuild"],["cellnet","Primitive cells, step by step","animPrimitive"],["cellnet","Primitive cell \u2192 3D array \u2192 2D layer","animJourney"],["cellnet","BCC: 2D layer \u2192 primitive cell","animBcc"],["cellnet","HCP: ABAB stacking","animHcp"],["stacking","ABC stacking","stacking"],["neighbors","Neighbors & coordination","neighbors"],["interstitials","Interstitial sites","interstitials"],["slip","Slip systems","slip"],["reciprocal","Reciprocal space & diffraction","diffraction"]],pa=[["crystal","Crystal & unit cells","crystal"],["geometry","Directions & planes","planes"],["surface","Surface crystallography","surface"],["stacking","Atomic stacking","stacking"],["environment","Local environment","neighbors"],["slip","Slip & Burgers vectors","slip"],["reciprocal","Reciprocal & diffraction","reciprocal"]],Rd={crystal:"crystal",primitive:"crystal",coordinates:"crystal",directions:"geometry",planes:"geometry",spacing:"geometry",surface:"surface",packing:"surface",cellnet:"surface",stacking:"stacking",neighbors:"environment",interstitials:"environment",slip:"slip",partials:"slip",reciprocal:"reciprocal"},Em={6:"Six",8:"Eight",12:"Twelve"},Co={hkl:[0,0,1]},Po={basic:{title:n=>`Basic ${n.short} cell`,concept:"crystal",patch:{}},counting:{title:"Count shared atoms",concept:"crystal",patch:{clip:!0,radius:.27}},primitive:{title:"Conventional vs primitive",concept
